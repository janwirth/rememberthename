name = "rememberthename"
version = "0.1.0"

internal_modules = [
  "adapters/*",
  "cli/*",
]

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 1.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_hackney = ">= 1.3.3 and < 2.0.0"
shore = ">= 1.3.0 and < 2.0.0"
dot_env = ">= 1.2.0 and < 2.0.0"
simplifile = ">= 2.4.0 and < 3.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.0.0 and < 2.0.0"
sqlight = ">= 1.0.3 and < 2.0.0"
gleetube = ">= 1.0.0 and < 2.0.0"
spotify_client = { git = "https://github.com/janwirth/gleam_spotify_client", ref = "gleam-http-4" }
argv = ">= 1.0.2 and < 2.0.0"
envoy = ">= 1.1.0 and < 2.0.0"
shellout = ">= 1.8.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
